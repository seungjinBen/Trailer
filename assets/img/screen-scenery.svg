<?xml version="1.0" encoding="UTF-8"?>
<!--
  트레일러 알림 화면 목업 (실제 운영 화면 기준으로 재현)
  - 창밖 풍경 알림(왼쪽/오른쪽 창밖 + 명소명 + 분류·고도) / 일정 알림(출발 10분 전 리마인드)
  - 실제 스크린샷 PNG(1080x2340)로 교체할 경우 index.html 의 src 확장자만 바꾸면 됩니다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1170" width="540" height="1170" role="img" aria-label="트레일러 알림 화면 — 창밖 풍경 알림과 열차 출발 알림 목록">
