  <rect x="44" y="580" width="92" height="80" rx="16" fill="#F4F6F9"/>
  <g transform="translate(90,608)" fill="none" stroke="#1FA37F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
