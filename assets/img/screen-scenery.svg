  <text x="28" y="734" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" font-weight="700" fill="#8A91A0">어제</text>

  <rect x="24" y="752" width="492" height="110" rx="18" fill="#ffffff" stroke="#ECEFF5" stroke-width="1.6"/>
  <text x="48" y="790" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="800" fill="#21262F">일정알림</text>
