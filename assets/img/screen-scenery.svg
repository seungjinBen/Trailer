  <text x="158" y="618" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="800" fill="#21262F">계룡산</text>
  <text x="158" y="649" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="500" fill="#8A91A0">peak · 845m</text>

